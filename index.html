<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RoTrivia - Istoria României</title>
	<link rel="stylesheet" href="style.css">
    <script src="DragDropTouch.min.js"></script>
</head>
<body>
    <div id="stats-container">
        <div id="score-board">
            Scor: <span id="current-score">0</span> | Record: <span id="best-score">0</span>
        </div>
        <div id="lives-container"></div>
    </div>
    <div id="active-area">
        <div class="active-card-wrapper" id="active-card-container" draggable="true"></div>
    </div>
    <div id="timeline-container">
        <div class="timeline-line"></div>
    </div>
    <script src="events.js"></script>
    <script>
        let deck = [];
        let timeline = [];
        let currentCard = null;
        let lives = 3;
        let score = 0;
        let isProcessing = false;
		let recordGlobal = 0;

		const BIN_ID = "699374fcd0ea881f40bf868c";
		const ACCESS_KEY = "$2a$10$p3wc8gKUNVvCTvnHkeVu6OFvVJ8ElCSl7lp.7z40eNMlME5QjNt42";
		async function incarcaTop10() {
			try {
				const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
					headers: { 'X-Access-Key': ACCESS_KEY }
				});
				if (!response.ok) throw new Error("Eroare la citire");
				const data = await response.json();
				return data.record; 
			} catch (eroare) {
				console.error("Nu am putut încărca topul:", eroare);
				return [];
			}
		}
		async function salveazaScorNou(numeJucator, scorObtinut) {
			let topActual = await incarcaTop10();
			topActual.push({ nume: numeJucator, scor: scorObtinut });
			topActual.sort((a, b) => b.scor - a.scor);
			topActual = topActual.slice(0, 10);
			try {
				await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
					method: 'PUT',
					headers: {
						'Content-Type': 'application/json',
						'X-Access-Key': ACCESS_KEY
					},
					body: JSON.stringify(topActual)
				});
				return topActual;
			} catch (eroare) {
				console.error("Eroare la salvare:", eroare);
				return topActual;
			}
		}
		incarcaTop10().then(top => {
			if (top && top.length > 0) {
				recordGlobal = top[0].scor; 
				document.getElementById('best-score').innerText = recordGlobal;
			}
		});
		
        const timelineContainer = document.getElementById('timeline-container');
        const activeCardContainer = document.getElementById('active-card-container');
        const livesContainer = document.getElementById('lives-container');
        const currentScoreEl = document.getElementById('current-score');
        const bestScoreEl = document.getElementById('best-score');

        activeCardContainer.addEventListener('dragstart', (e) => {
            if (isProcessing || !currentCard) { e.preventDefault(); return; }
            e.dataTransfer.setData('text/plain', 'card');
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => activeCardContainer.classList.add('dragging'), 0);
        });

        activeCardContainer.addEventListener('dragend', () => {
            activeCardContainer.classList.remove('dragging');
        });

        function initGame() {
            bestScoreEl.innerText = recordGlobal; 
            currentScoreEl.innerText = score;
            deck = [...eventsData].sort(() => Math.random() - 0.5);
            timeline.push(deck.pop());
            updateLivesDisplay();
            drawNextCard();
            renderTimeline();
        }

        function updateLivesDisplay() {
            let html = '';
            for(let i = 0; i < 3; i++) {
                html += i < lives ? '<span class="heart-active">♥</span>' : '<span class="heart-lost">♥</span>';
            }
            livesContainer.innerHTML = html;
        }

        function createCardHTML(cardData, footerClass, footerText) {
            return `
                <div class="card">
                    <div class="card-header">
                        <p class="card-title">${cardData.name}</p>
                        <p class="card-desc">${cardData.desc}</p>
                    </div>
                    <img class="card-image" 
                         src="${cardData.img}" 
                         alt="${cardData.name}"
                         onerror="this.onerror=null; this.src='imagini/rezerva.jpg';">
                    <div class="card-footer ${footerClass}">${footerText}</div>
                </div>
            `;
        }

        function drawNextCard() {
            if (deck.length === 0) {
                activeCardContainer.innerHTML = `<h2 style="color:white; text-align:center;">Ai plasat toate cărțile!</h2>`;
                activeCardContainer.draggable = false;
                currentCard = null;
                return;
            }
            currentCard = deck.pop();
            activeCardContainer.innerHTML = createCardHTML(currentCard, 'footer-active', 'când?');
            activeCardContainer.draggable = true;
        }

        function renderTimeline() {
            timelineContainer.innerHTML = '<div class="timeline-line"></div>';

            for (let i = 0; i <= timeline.length; i++) {
                
                const gap = document.createElement('div');
                gap.className = 'gap';
                
                if (currentCard && !isProcessing) {
                    gap.addEventListener('dragenter', (e) => {
                        e.preventDefault();
                        gap.classList.add('drag-over'); 
                    });

                    gap.addEventListener('dragover', (e) => {
                        e.preventDefault(); 
                    });

                    gap.addEventListener('dragleave', (e) => {
                        gap.classList.remove('drag-over'); 
                    });

                    gap.addEventListener('drop', (e) => {
                        e.preventDefault();
                        gap.classList.remove('drag-over');
                        checkPlacement(i);
                    });
                }
                
                timelineContainer.appendChild(gap);

                if (i < timeline.length) {
                    const cardData = timeline[i];
                    let footerClass = cardData.isError ? 'footer-error' : 'footer-correct';
                    let footerText = cardData.year;

                    const cardDiv = document.createElement('div');
                    cardDiv.innerHTML = createCardHTML(cardData, footerClass, footerText);
                    timelineContainer.appendChild(cardDiv.firstElementChild);
                }
            }
        }

        function checkPlacement(insertIndex) {
            if (!currentCard || isProcessing) return;
            isProcessing = true;

            const prevCard = timeline[insertIndex - 1];
            const nextCard = timeline[insertIndex];
            const currentYear = currentCard.year;
            let isCorrect = true;

            if (prevCard && currentYear < prevCard.year) isCorrect = false;
            if (nextCard && currentYear > nextCard.year) isCorrect = false;

            if (isCorrect) {
                timeline.splice(insertIndex, 0, currentCard);
                score++;
                currentScoreEl.innerText = score;
                if(score > recordGlobal) {
                    recordGlobal = score;
                    bestScoreEl.innerText = recordGlobal;
                }

                isProcessing = false;
                drawNextCard();
                renderTimeline();
                
                setTimeout(() => {
                    const cardsOnBoard = timelineContainer.querySelectorAll('.card');
                    if (cardsOnBoard[insertIndex]) {
                        cardsOnBoard[insertIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                }, 50);

            } else {
                lives--;
                updateLivesDisplay();
                currentCard.isError = true;

                let correctIndex = 0;
                while (correctIndex < timeline.length && timeline[correctIndex].year < currentCard.year) {
                    correctIndex++;
                }

                timeline.splice(correctIndex, 0, currentCard);
                activeCardContainer.style.opacity = '0';
                renderTimeline();

                setTimeout(() => {
                    const cardsOnBoard = timelineContainer.querySelectorAll('.card');
                    if(cardsOnBoard[correctIndex]) {
                        cardsOnBoard[correctIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                }, 50);

                setTimeout(() => {
                    if (lives <= 0) {
                        declanseazaGameOver(score);
                    } else {
                        activeCardContainer.style.opacity = '1';
                        isProcessing = false;
                        drawNextCard();
                        renderTimeline();
                    }
                }, 2000); 
            }
        }
		function declanseazaGameOver(scorFinal) {
			document.getElementById("final-score").innerText = scorFinal;
			document.getElementById("game-over-modal").style.display = "flex";
		}
		async function trimiteScor() {
			const inputNume = document.getElementById("nume-jucator");
			const nume = inputNume.value.trim() || "Anonim";
			const scor = parseInt(document.getElementById("final-score").innerText);
			document.getElementById("nume-input-section").style.display = "none";
			document.getElementById("loading-top").style.display = "block";
			const noulTop = await salveazaScorNou(nume, scor);
			afiseazaClasamentulInHtml(noulTop);
		}
		function afiseazaClasamentulInHtml(topData) {
			document.getElementById("loading-top").style.display = "none";
			document.getElementById("leaderboard-section").style.display = "block";
			
			const ul = document.getElementById("leaderboard-list");
			ul.innerHTML = "";
			topData.forEach((jucator, index) => {
				let medalie = `${index + 1}.`;
				if (index === 0) medalie = "🥇";
				if (index === 1) medalie = "🥈";
				if (index === 2) medalie = "🥉";
				const li = document.createElement("li");
				li.innerHTML = `<span>${medalie} ${jucator.nume}</span> <strong>${jucator.scor} pct</strong>`;
				ul.appendChild(li);
			});
		}
        timelineContainer.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            timelineContainer.scrollLeft += evt.deltaY * 2; 
        });
        
        let isDown = false;
        let startX, scrollLeft;

        timelineContainer.addEventListener('mousedown', (e) => {
            isDown = true;
            timelineContainer.classList.add('active'); 
            startX = e.pageX - timelineContainer.offsetLeft;
            scrollLeft = timelineContainer.scrollLeft;
            timelineContainer.style.scrollBehavior = 'auto'; 
        });
        timelineContainer.addEventListener('mouseleave', () => {
            isDown = false;
            timelineContainer.classList.remove('active');
            timelineContainer.style.scrollBehavior = 'smooth'; 
        });
        timelineContainer.addEventListener('mouseup', () => {
            isDown = false;
            timelineContainer.classList.remove('active');
            timelineContainer.style.scrollBehavior = 'smooth';
        });
        timelineContainer.addEventListener('mousemove', (e) => {
            if (!isDown) return; 
            e.preventDefault(); 
            const x = e.pageX - timelineContainer.offsetLeft;
            const walk = (x - startX) * 1.5; 
            timelineContainer.scrollLeft = scrollLeft - walk;
        });
        
        initGame();
    </script>
<div id="game-over-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2>Game Over</h2>
        <p>Scorul tău: <span id="final-score" style="font-weight: bold; color: #4caf50; font-size: 24px;">0</span></p>
        
        <div id="nume-input-section">
            <p>Ai intrat în top! Cum te cheamă?</p>
            <input type="text" id="nume-jucator" placeholder="Numele tău" maxlength="15">
            <button id="btn-salveaza-scor" onclick="trimiteScor()">Salvează Scorul</button>
        </div>

        <div id="loading-top" style="display: none;">
            <p>Se actualizează clasamentul...</p>
        </div>

        <div id="leaderboard-section" style="display: none;">
            <h3>🏆 Top 10 Jucători 🏆</h3>
            <ul id="leaderboard-list"></ul>
            <button onclick="location.reload()" style="margin-top: 15px;">Joacă din nou</button>
        </div>
    </div>
</div>
</body>
</html>
